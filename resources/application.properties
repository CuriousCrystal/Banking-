spring.application.name=bfsi-app
server.port=8080

# behind a load balancer / reverse proxy: trust X-Forwarded-* from internal proxies (client IP, https detection)
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# No profile given (mvn spring-boot:run) -> local development. Production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# ---------- database: the schema is owned by Flyway (resources/db/migration); Hibernate only validates it ----------
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT / CORS (the signing key is per profile - see application-{dev,h2,prod}.properties) ----------
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# ---------- multi-tenancy and onboarding ----------
# bank code assumed at login when the client sends none (dev/demo only - production leaves it empty)
app.tenancy.default-slug=
# demo bank + three demo logins + sample customers (dev/h2 only)
app.seed.enabled=false
# login + signup attempts allowed per client IP per minute
app.auth.rate-limit-per-minute=30

bank.name=AMC Bank
bank.branch-code=1102

# ---------- ops ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
