# Local development: MySQL on localhost, demo data, API docs. Used when no profile is active.
# The database is bfsi_saas (Flyway creates the tables). The older single-tenant bfsi_db is left untouched.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bfsi_saas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
# never commit the real password: set DB_PASSWORD, or put it in the git-ignored ./config/application.properties
spring.datasource.password=${DB_PASSWORD:}

# dev-only signing key - public in git on purpose, only ever used by the dev and h2 profiles (and tests)
app.jwt.secret=bWFrZS10aGlzLWEtbG9uZy1yYW5kb20tc2VjcmV0LWZvci1obWFjLXNoYTI1Ng==
app.seed.enabled=true
app.tenancy.default-slug=amc-bank

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.amc.bfsi=DEBUG
