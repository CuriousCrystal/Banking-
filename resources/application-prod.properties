# Production: every setting comes from the environment - nothing secret lives in the repo.
# A missing variable stops the start-up on purpose ("Could not resolve placeholder ...").
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# base64 HMAC key, at least 32 bytes:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}

# empty = same-origin only (the bundled nginx proxies /api). Set it if the UI is served from another domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# health probes + Prometheus live on an internal port that is NOT published (see docker-compose.yml)
management.server.port=${MANAGEMENT_PORT:8081}
