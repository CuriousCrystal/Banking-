# Zero-setup demo / test profile: in-memory H2 (MySQL mode) running the same Flyway migrations as production.
#   mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.datasource.url=jdbc:h2:mem:bfsi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

# dev-only signing key - public in git on purpose, only ever used by the dev and h2 profiles (and tests)
app.jwt.secret=bWFrZS10aGlzLWEtbG9uZy1yYW5kb20tc2VjcmV0LWZvci1obWFjLXNoYTI1Ng==
app.seed.enabled=true
app.tenancy.default-slug=amc-bank
# tests and demos log in a lot from one IP
app.auth.rate-limit-per-minute=1000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
